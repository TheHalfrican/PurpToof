[package]
name = "purptoof"
version = "0.1.0"
edition = "2024"
description = "Windows Bluetooth A2DP audio receiver that recovers itself when the audio path dies"
# spike-a2dp is a diagnostic that opens a real stream; it must never be what a
# bare `cargo run` launches.
default-run = "purptoof"

[dependencies]
anyhow = "1.0.104"
# The window. default-features off because the defaults pull in accesskit and
# persistence, neither of which a single-view tray app needs; wayland/x11 are
# omitted because this crate binds WinRT and does not build anywhere but
# Windows anyway.
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "glow",
] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
# The subscriber and the rolling daily file. A tray app has nowhere to print,
# so without this every diagnostic the app already emits goes nowhere - and
# "did it heal itself overnight" is a question only a log can answer.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
    "env-filter",
] }
tracing-appender = "0.2"
tray-icon = "0.25.0"

[dev-dependencies]
# Two invariants that table-driven tests cannot express: that no input
# sequence produces a reconnect storm, and that sustained Playing + silence
# always eventually recovers. The first protects the user from a bug in the
# decision logic; the second stops the first from being satisfied by a state
# machine that simply never acts.
proptest = "1.5"

[dependencies.windows]
version = "0.62.2"
features = [
    # IAsyncOperation and .get() on WinRT async methods; HSTRING.
    "Foundation",
    # IVectorView, needed to walk a DeviceInformationCollection.
    "Foundation_Collections",
    # DeviceInformation::FindAllAsync — enumerates paired A2DP sources.
    "Devices_Enumeration",
    # AudioPlaybackConnection: the only sanctioned A2DP sink on modern Windows.
    "Media_Audio",
    # Signal B. GlobalSystemMediaTransportControlsSessionManager — the remote's
    # own view of what it is playing, surfaced over AVRCP.
    "Media_Control",
    # CoInitializeEx, CoCreateInstance, STGM_READ.
    "Win32_System_Com",
    # IAudioMeterInformation lives in its own child namespace, not alongside
    # the rest of the WASAPI interfaces.
    "Win32_Media_Audio_Endpoints",
    # Signal A. IMMDeviceEnumerator and the session
    # interfaces (IAudioSessionManager2 / IAudioSessionControl2) used to work
    # out whether A2DP render audio is attributable to a process at all.
    "Win32_Media_Audio",
    # PROPVARIANT, PropVariantClear — reading the endpoint's friendly name.
    "Win32_System_Com_StructuredStorage",
    # VT_LPWSTR, the PROPVARIANT discriminant we expect for a device name.
    "Win32_System_Variant",
    # IPropertyStore.
    "Win32_UI_Shell_PropertiesSystem",
    # PKEY_Device_FriendlyName.
    "Win32_Devices_FunctionDiscovery",
    # OpenProcess / QueryFullProcessImageNameW — naming the process that owns
    # an audio session, which is the whole point of the attribution check.
    "Win32_System_Threading",
    # CloseHandle for the above.
    "Win32_Foundation",
    # Re-arm trigger: RegisterSuspendResumeNotification. The DEVICE_NOTIFY_CALLBACK
    # form, which needs no window handle and therefore no message pump.
    "Win32_System_Power",
    # Re-arm trigger: Radio::StateChanged, for the Bluetooth adapter being
    # toggled from Action Center.
    "Devices_Radios",
    # Autostart: the per-user Run key.
    "Win32_System_Registry",
    # RegisterSuspendResumeNotification and DEVICE_NOTIFY_CALLBACK live behind
    # this gate even in their window-free form.
    "Win32_UI_WindowsAndMessaging",
]

# Match Lockstep: keep this crate cheap to debug while dependencies stay
# optimized. The audio watchdog polls at ~10 Hz and a fully unoptimized
# dependency tree makes timing observations in a debug build meaningless.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
