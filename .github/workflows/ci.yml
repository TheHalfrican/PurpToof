name: CI

# The pure core only. Everything that needs a real Bluetooth radio, a paired
# phone, or a live audio endpoint — the A2DP sink itself, the WASAPI peak
# meter, GSMTC playback state — is verified on the target machine via the soak
# matrix in docs/soak.md. A hosted runner has none of that hardware, and
# mocking the WinRT seam here would only test the mock.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global `RUSTFLAGS: -D warnings`: RUSTFLAGS applies to
  # dependencies too, so a warning inside the `windows` crate would fail our
  # build for no reason. The lint gate is the clippy step below, which only
  # lints this crate.

jobs:
  check:
    # windows-latest is not a preference. This crate binds WinRT and Win32
    # directly and does not build anywhere else.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Deliberately NOT taiki-e/install-action@nextest. That action shells out
      # to bash and then looks for a sentinel file under %USERPROFILE%, but a
      # self-hosted runner overrides HOME for job steps, so the sentinel lands
      # elsewhere and it retries ten times before reporting a "bash startup
      # failure" that never happened. Gitea CI failed this way from the very
      # first push. The prebuilt binary needs no bash and behaves the same on
      # hosted and self-hosted runners.
      - name: Install cargo-nextest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Respect CARGO_HOME. The self-hosted runner sets it to a
          # runner-local directory so CI cannot touch the developer's real
          # Rust install; hosted runners leave it unset.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { "$env:USERPROFILE\.cargo" }
          $dest = Join-Path $cargoHome 'bin'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'nextest.zip'
          Invoke-WebRequest -Uri 'https://get.nexte.st/latest/windows' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          & "$dest\cargo-nextest.exe" nextest --version

      - name: Check formatting
        run: cargo fmt --check

      # --all-targets so test code is linted to the same standard as the crate.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # --no-tests=pass because nextest treats an empty test set as an error,
      # and the crate genuinely has no tests until milestone 5. This is not a
      # licence to ship an untested core: the ratio gate below is what makes
      # "core/ has no tests" a build failure, and it is the stricter check.
      - name: Test
        run: cargo nextest run --no-tests=pass

      # Enforced on src/core/ only. The exemptions and the reasoning behind
      # them are documented in the script itself — read it before changing
      # this step.
      - name: Test-to-production ratio gate (core/ only)
        shell: pwsh
        run: ./scripts/check-test-ratio.ps1

      # A release build exercises LTO, the build script's resource embedding and
      # panic=abort, none of which the debug build touches - so a packaging
      # break would otherwise only surface when cutting a release.
      - name: Release build
        run: cargo build --release

      # Idempotent, and works on both runners. A plain `choco install` broke the
      # self-hosted one, which has winget rather than chocolatey and already had
      # both tools - so it failed while having nothing to do.
      - name: Install packaging tools
        shell: pwsh
        run: ./scripts/ensure-packaging-tools.ps1

      - name: Build installers
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error
